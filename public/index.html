<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Suport Moldcell</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1c1c1c;
    --border: #2a2a2a;
    --accent: #e4002b;
    --accent-dim: rgba(228,0,43,0.12);
    --accent-glow: rgba(228,0,43,0.2);
    --text: #f0f0f0;
    --text-dim: #888;
    --text-muted: #555;
    --user-bubble: #2a0a0f;
    --user-border: rgba(228,0,43,0.3);
    --bot-bubble: #1a1a1a;
    --font: 'DM Sans', sans-serif;
  }

  html, body { height: 100%; background: var(--bg); font-family: var(--font); color: var(--text); overflow: hidden; }

  .phone-shell { width: 100%; max-width: 420px; height: 100dvh; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }

  .brand { display: flex; align-items: center; gap: 10px; }

  .logo { width: 38px; height: 38px; border-radius: 10px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: white; letter-spacing: -1px; box-shadow: 0 0 12px var(--accent-glow); }

  .brand-info h1 { font-size: 15px; font-weight: 600; }
  .brand-info p { font-size: 11px; color: var(--accent); display: flex; align-items: center; gap: 4px; }
  .brand-info p::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; animation: pulse 2s ease-in-out infinite; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .topbar-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-dim); font-size: 15px; transition: all 0.2s; }
  .topbar-btn:hover { background: var(--surface2); color: var(--text); }

  .messages { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .welcome-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; animation: fadeUp 0.4s ease; }

  .welcome-header { display: flex; align-items: center; gap: 12px; }
  .welcome-logo { width: 48px; height: 48px; border-radius: 12px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: white; box-shadow: 0 0 16px var(--accent-glow); }
  .welcome-info h2 { font-size: 15px; font-weight: 600; }
  .welcome-info p { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .welcome-text { font-size: 14px; color: var(--text-dim); line-height: 1.5; }
  .welcome-text strong { color: var(--text); }

  .quick-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 6px 12px; font-size: 12px; color: var(--text-dim); cursor: pointer; transition: all 0.2s; font-family: var(--font); }
  .chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  .msg { display: flex; gap: 8px; animation: fadeUp 0.3s ease; max-width: 100%; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .msg.user { flex-direction: row-reverse; }

  .msg-avatar { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; font-size: 11px; font-weight: 700; color: white; }
  .msg-avatar.user-av { background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim); border-radius: 50%; }

  .bubble { max-width: 78%; padding: 11px 14px; border-radius: 16px; font-size: 14px; line-height: 1.55; }
  .msg.bot .bubble { background: var(--bot-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; color: var(--text); }
  .msg.user .bubble { background: var(--user-bubble); border: 1px solid var(--user-border); border-bottom-right-radius: 4px; color: var(--text); }

  .bubble-time { font-size: 10px; color: var(--text-muted); margin-top: 4px; }
  .msg.user .bubble-time { text-align: right; }

  .typing { display: flex; align-items: center; gap: 4px; padding: 12px 14px; background: var(--bot-bubble); border: 1px solid var(--border); border-radius: 16px; border-bottom-left-radius: 4px; width: fit-content; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: bounce 1.2s ease infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-5px); opacity: 1; } }

  .date-divider { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--text-muted); }
  .date-divider::before, .date-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .input-area { padding: 12px 16px 20px; border-top: 1px solid var(--border); background: var(--bg); flex-shrink: 0; }
  .input-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 28px; padding: 8px 8px 8px 16px; transition: border-color 0.2s; }
  .input-row:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .input-row input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 14px; font-family: var(--font); min-width: 0; }
  .input-row input::placeholder { color: var(--text-muted); }

  .send-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; color: white; }
  .send-btn:hover { opacity: 0.85; transform: scale(1.05); }
  .send-btn:active { transform: scale(0.95); }
  .send-btn:disabled { background: var(--surface2); color: var(--text-muted); cursor: not-allowed; transform: none; }
  .send-btn svg { width: 16px; height: 16px; }
</style>
</head>
<body>
<div class="phone-shell">
  <div class="topbar">
    <div class="brand">
      <div class="logo">MC</div>
      <div class="brand-info">
        <h1>Suport Moldcell</h1>
        <p>Disponibil 24/7</p>
      </div>
    </div>
    <button class="topbar-btn" onclick="clearChat()" title="Conversație nouă">↺</button>
  </div>

  <div class="messages" id="messages">
    <div class="date-divider">Astăzi</div>
    <div class="welcome-card">
      <div class="welcome-header">
        <div class="welcome-logo">MC</div>
        <div class="welcome-info">
          <h2>Asistent virtual Moldcell</h2>
          <p>Consultant digital disponibil non-stop</p>
        </div>
      </div>
      <div class="welcome-text">
        Bună ziua. Sunt asistentul virtual Moldcell. Vă pot ajuta cu informații despre abonamente, internet mobil, roaming, reîncărcare și alte servicii. Cum vă pot ajuta?
      </div>
      <div class="quick-chips">
        <button class="chip" onclick="sendQuick('Ce abonamente oferiți?')">Abonamente</button>
        <button class="chip" onclick="sendQuick('Cum activez roaming-ul?')">Roaming</button>
        <button class="chip" onclick="sendQuick('Cum îmi reîncarc numărul?')">Reîncărcare</button>
        <button class="chip" onclick="sendQuick('Internetul meu nu funcționează')">Probleme tehnice</button>
        <button class="chip" onclick="sendQuick('Cum verific soldul?')">Sold</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <input type="text" id="userInput" placeholder="Scrieți întrebarea..."
             onkeydown="if(event.key==='Enter') sendMessage()" maxlength="500" />
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
  let isLoading = false;
  let conversationHistory = [];
  const messagesEl = document.getElementById('messages');

  function getTime() {
    return new Date().toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' });
  }

  function appendMsg(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;

    const av = document.createElement('div');
    av.className = role === 'bot' ? 'msg-avatar' : 'msg-avatar user-av';
    av.textContent = role === 'bot' ? 'MC' : 'Tu';

    const wrap = document.createElement('div');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    const time = document.createElement('div');
    time.className = 'bubble-time';
    time.textContent = getTime();

    wrap.appendChild(bubble);
    wrap.appendChild(time);
    div.appendChild(av);
    div.appendChild(wrap);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.id = 'typing-indicator';
    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.textContent = 'MC';
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.innerHTML = '<span></span><span></span><span></span>';
    div.appendChild(av);
    div.appendChild(typing);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing-indicator');
    if (t) t.remove();
  }

  async function sendMessage() {
    if (isLoading) return;
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    isLoading = true;
    document.getElementById('sendBtn').disabled = true;

    appendMsg('user', text);
    conversationHistory.push({ role: 'user', content: text });
    showTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: conversationHistory })
      });

      const data = await res.json();
      if (data.error) throw new Error(data.error);

      conversationHistory.push({ role: 'assistant', content: data.reply });
      removeTyping();
      appendMsg('bot', data.reply);
    } catch (err) {
      removeTyping();
      appendMsg('bot', 'Eroare de conexiune. Încercați din nou.');
    }

    isLoading = false;
    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }

  function sendQuick(text) {
    document.getElementById('userInput').value = text;
    sendMessage();
  }

  function clearChat() {
    conversationHistory = [];
    messagesEl.innerHTML = '';
    const d = document.createElement('div');
    d.className = 'date-divider';
    d.textContent = 'Conversație nouă';
    messagesEl.appendChild(d);
    appendMsg('bot', 'Conversație nouă. Cum vă pot ajuta?');
  }
</script>
</body>
</html>
